name = "ampliva-smm-panel"
main = "src/index.ts"
compatibility_date = "2026-08-31"
keep_vars = true

[vars]
CID_API_URL = "https://cidgrowthmedia.com/api/v2"
CID_CURRENCY = "INR"
DEFAULT_MARKUP_PERCENT = "35"
# Set ADMIN_EMAIL to your email so your account always has admin rights.
# (The first account registered on a fresh database also becomes admin.)
ADMIN_EMAIL = "arppithandrewsee@gmail.com"
# Public UPI ID customers send manual top-ups to, e.g. "yourname@okhdfcbank".
# Leave empty to keep manual top-ups disabled.
PUBLIC_UPI_ID = "arppithandrewsee@okaxis"
SESSION_TTL_DAYS = "30"

# D1 catalogue / accounts / wallet / orders database.
# ampliva-db created in the owner's Cloudflare account on 2026-10-21;
# schema lives in migrations/ (apply via D1 console paste or wrangler).
[[d1_databases]]
binding = "DB"
database_name = "ampliva-db"
database_id = "f03b50d9-ece5-4509-9885-656030ebe42e"
migrations_dir = "migrations"

# Daily catalogue sync at 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]

[secrets]
required = ["CID_API_KEY"]
